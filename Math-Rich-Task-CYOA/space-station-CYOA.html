<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMBINED FACILITY OUTER-11 | TERMINAL ACCESS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #terminal-body {
      scroll-behavior: smooth;
    }
    .spacer-block {
      min-height: 70vh; /* Runway for state top-alignment */
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="crt-screen" id="crt">
    <div id="terminal-body">
      <div id="terminal-content"></div>
      <div class="spacer-block" id="bottom-spacer"></div>
    </div>
    <div id="module-viewport" style="display: none;"></div>
    <div class="input-line" id="input-container">
      <span class="prompt-label">&gt;</span>
      <input type="text" id="command-input" autocomplete="off" autofocus spellcheck="false">
    </div>
  </div>

  <script>
    const terminalBody = document.getElementById('terminal-body');
    const terminalContent = document.getElementById('terminal-content');
    const commandInput = document.getElementById('command-input');
    const crtScreen = document.getElementById('crt');
    const moduleViewport = document.getElementById('module-viewport');
    const inputContainer = document.getElementById('input-container');

    // Engine State
    let scenarioData = null;
    let currentStateId = null;
    let isTyping = false;

    // Global Flag System (Default includes new_message_1)
    let gameFlags = ["new_message_1"];

    // Reset Confirmation State
    let pendingReset = false;

    // Local Storage Key
    const SAVE_KEY = 'outer11_terminal_save';

    // Line Timing Controls (milliseconds)
    const BASE_LINE_DELAY = 60;
    const RANDOM_VARIANCE = 40;

    function normalizeCommand(str) {
      if (!str) return '';
      return str.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // Flag Helper Functions
    function hasFlag(flagName) {
      return gameFlags.includes(flagName);
    }

    function addFlag(flagName) {
      if (!gameFlags.includes(flagName)) {
        gameFlags.push(flagName);
      }
    }

    function removeFlag(flagName) {
      gameFlags = gameFlags.filter(f => f !== flagName);
    }

    function applyFlagChanges(setFlags = [], removeFlags = []) {
      if (Array.isArray(setFlags)) setFlags.forEach(addFlag);
      if (Array.isArray(removeFlags)) removeFlags.forEach(removeFlag);
    }

    function scrollToTextBottom() {
      const contentBottom = terminalContent.offsetTop + terminalContent.offsetHeight;
      const viewportHeight = terminalBody.clientHeight;
      
      if (contentBottom > terminalBody.scrollTop + viewportHeight) {
        terminalBody.scrollTop = contentBottom - viewportHeight + 40;
      }
    }

    function scrollToElementTop(element) {
      if (!element) return;
      terminalBody.scrollTop = element.offsetTop - 10;
    }

    function saveGameState() {
      if (!currentStateId) return;
      const payload = {
        currentStateId: currentStateId,
        historyHTML: terminalContent.innerHTML,
        gameFlags: gameFlags,
        timestamp: Date.now()
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    }

    function loadGameState() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e) {
        console.error("Save state corruption detected:", e);
        return null;
      }
    }

    function printLines(lines, index = 0, alignTop = false, anchorElement = null, callback = null) {
      if (index < lines.length) {
        isTyping = true;
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.textContent = lines[index];
        terminalContent.appendChild(entry);

        const currentAnchor = anchorElement || entry;

        if (alignTop) {
          if (index === 0) {
            scrollToElementTop(currentAnchor);
          }
        } else {
          scrollToTextBottom();
        }

        const randomDelay = BASE_LINE_DELAY + Math.floor(Math.random() * RANDOM_VARIANCE);
        setTimeout(() => printLines(lines, index + 1, alignTop, currentAnchor, callback), randomDelay);
      } else {
        isTyping = false;
        saveGameState();
        if (callback) callback();
      }
    }

    function appendUserMessage(msg) {
      const entry = document.createElement('div');
      entry.className = 'log-entry user-entry';
      entry.textContent = '> ' + msg;
      terminalContent.appendChild(entry);
      scrollToTextBottom();
      saveGameState();
    }

    function appendSystemResponse(lines) {
      const lineArray = Array.isArray(lines) ? lines : [lines];
      printLines(lineArray, 0, false);
    }

    async function loadPuzzleModule(targetUrl, nextStateOnComplete) {
      try {
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const html = await response.text();

        terminalBody.style.display = 'none';
        inputContainer.style.display = 'none';
        moduleViewport.style.display = 'block';
        moduleViewport.innerHTML = html;

        moduleViewport.dataset.nextState = nextStateOnComplete || '';

        const scripts = moduleViewport.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        console.error("Failed to load puzzle component:", err);
        appendSystemResponse(`[SYSTEM ERROR]: Unable to fetch diagnostic module at '${targetUrl}'.`);
      }
    }

    window.completePuzzleModule = function(overrideNextState = null, setFlags = [], removeFlags = []) {
      applyFlagChanges(setFlags, removeFlags);

      const nextState = overrideNextState || moduleViewport.dataset.nextState;
      moduleViewport.innerHTML = '';
      moduleViewport.style.display = 'none';
      terminalBody.style.display = 'block';
      inputContainer.style.display = 'flex';
      commandInput.focus();

      if (nextState) {
        transitionToState(nextState);
      }
    };

    function transitionToState(stateId) {
      if (!scenarioData || !scenarioData.states[stateId]) {
        appendSystemResponse(`[FATAL ERROR]: Invalid state node reference '${stateId}'.`);
        return;
      }

      currentStateId = stateId;
      const state = scenarioData.states[stateId];

      if (state.type === 'redirect') {
        if (state.fallbackText) {
          appendSystemResponse(state.fallbackText);
        }
        setTimeout(() => {
          loadPuzzleModule(state.targetUrl, state.nextState);
        }, 1000);
        return;
      }

      if (state.content && Array.isArray(state.content)) {
        let linesToPrint = [...state.content];

        if (state.dynamicLines && Array.isArray(state.dynamicLines)) {
          state.dynamicLines.forEach(item => {
            if (item.token) {
              const lineIndex = linesToPrint.indexOf(item.token);
              if (lineIndex !== -1) {
                let chosenText = item.defaultText || '';

                if (item.rules && Array.isArray(item.rules)) {
                  for (const rule of item.rules) {
                    const flagList = Array.isArray(rule.flags) ? rule.flags : [rule.flags];
                    const match = rule.condition === 'all' 
                      ? flagList.every(hasFlag) 
                      : flagList.some(hasFlag);

                    if (match) {
                      chosenText = rule.text;
                      break;
                    }
                  }
                }

                linesToPrint[lineIndex] = chosenText;
              }
            }
          });
        }

        printLines(linesToPrint, 0, true);
      } else {
        saveGameState();
      }
    }

    function processCommand(rawInput) {
      const normalizedInput = normalizeCommand(rawInput);

      // --- DEV COMMANDS ---
      if (['devhelp', 'dev-help', 'dev'].includes(normalizedInput)) {
        appendSystemResponse([
          "--------------------------------------------------------------------",
          "[DEV UTILITY CONSOLE]:",
          "  - 'flags' / 'showflags' : Display all currently active game flags.",
          "  - 'reset' / 'resetstate': Purge local save buffer and reboot.",
          "--------------------------------------------------------------------"
        ]);
        return;
      }

      if (['flags', 'showflags', 'getflags'].includes(normalizedInput)) {
        if (gameFlags.length === 0) {
          appendSystemResponse("[DEV LOG]: Active Flags: [NONE]");
        } else {
          appendSystemResponse([
            "[DEV LOG]: Active Flags:",
            ...gameFlags.map(f => `  - ${f}`)
          ]);
        }
        return;
      }

      // Handle active reset confirmation prompt
      if (pendingReset) {
        pendingReset = false;
        if (['y', 'yes', 'confirm'].includes(normalizedInput)) {
          localStorage.removeItem(SAVE_KEY);
          gameFlags = ["new_message_1"];
          terminalContent.innerHTML = '';
          appendSystemResponse([
            "[SYSTEM]: Memory buffer cleared.",
            "Re-initializing terminal state..."
          ]);
          setTimeout(() => {
            transitionToState(scenarioData.initialState || 'welcome');
          }, 800);
        } else {
          appendSystemResponse("[SYSTEM LOG]: Memory purge sequence aborted.");
        }
        return;
      }

      if (['resetstate', 'reset', 'clearsave', 'purge'].includes(normalizedInput)) {
        pendingReset = true;
        appendSystemResponse([
          "--------------------------------------------------------------------",
          "[WARNING]: Initiate full purge of local system state buffer?",
          "All saved progression will be erased.",
          "CONFIRM PURGE? (Y / N)",
          "--------------------------------------------------------------------"
        ]);
        return;
      }

      const currentState = scenarioData.states[currentStateId];

      if (!currentState || !currentState.commands) {
        appendSystemResponse(scenarioData.defaultUnrecognized || `[UNRECOGNIZED DIRECTIVE]: '${rawInput}'`);
        return;
      }

      const matchedCommand = currentState.commands.find(cmd => 
        cmd.input && cmd.input.some(alias => normalizeCommand(alias) === normalizedInput)
      );

      if (!matchedCommand) {
        const fallbackMsg = scenarioData.defaultUnrecognized 
          ? scenarioData.defaultUnrecognized.replace('%INPUT%', rawInput)
          : `[UNRECOGNIZED DIRECTIVE]: '${rawInput}'. Type 'help' for options.`;
        appendSystemResponse(fallbackMsg);
        return;
      }

      // Check command flag prerequisites (ALL required)
      if (matchedCommand.requiredFlags && !matchedCommand.requiredFlags.every(hasFlag)) {
        appendSystemResponse(matchedCommand.fallbackResponse || "[ACCESS DENIED]: Required clearance or security key missing.");
        return;
      }

      // Check command flag prerequisites (ANY required)
      if (matchedCommand.requiredFlagsAny && !matchedCommand.requiredFlagsAny.some(hasFlag)) {
        appendSystemResponse(matchedCommand.fallbackResponse || "[ACCESS DENIED]: Required clearance or security key missing.");
        return;
      }

      if (matchedCommand.forbiddenFlags && matchedCommand.forbiddenFlags.some(hasFlag)) {
        appendSystemResponse(matchedCommand.fallbackResponse || "[ACTION UNAVAILABLE]");
        return;
      }

      // Apply flag modifications from command choice
      applyFlagChanges(matchedCommand.setFlags, matchedCommand.removeFlags);

      switch (matchedCommand.type) {
        case 'text':
          appendSystemResponse(matchedCommand.response);
          break;

        case 'state':
          transitionToState(matchedCommand.nextState);
          break;

        case 'redirect':
          if (matchedCommand.fallbackText) {
            appendSystemResponse(matchedCommand.fallbackText);
          }
          setTimeout(() => {
            loadPuzzleModule(matchedCommand.targetUrl, matchedCommand.nextState);
          }, 1000);
          break;

        default:
          appendSystemResponse(`[SYSTEM LOG]: Command executed.`);
          break;
      }
    }

    commandInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const inputVal = commandInput.value.trim();
        if (inputVal === '' || isTyping) return;

        commandInput.value = '';
        appendUserMessage(inputVal);

        setTimeout(() => {
          processCommand(inputVal);
        }, 100);
      }
    });

    crtScreen.addEventListener('click', () => {
      if (moduleViewport.style.display === 'none') {
        commandInput.focus();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      fetch('scenario-1.json')
        .then(response => {
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return response.json();
        })
        .then(data => {
          scenarioData = data;
          if (data.title) document.title = data.title;

          const saved = loadGameState();
          if (saved && saved.currentStateId && scenarioData.states[saved.currentStateId]) {
            terminalContent.innerHTML = saved.historyHTML;
            currentStateId = saved.currentStateId;
            if (Array.isArray(saved.gameFlags)) {
              gameFlags = saved.gameFlags;
            }
            appendSystemResponse(["", "[SYSTEM]: Session automatically restored from local buffer."]);
          } else {
            transitionToState(data.initialState || 'welcome');
          }
        })
        .catch(err => {
          console.error('Failed to load scenario data:', err);
          appendSystemResponse([
            '[SYSTEM ERROR]: Unable to establish connection to scenario data pipeline.',
            'Ensure scenario-1.json exists in working directory and server is active.'
          ]);
        });
    });
  </script>
</body>
</html>
